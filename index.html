<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSEVOLVE | DISC Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init("OhvDHzB8R3Zxdh9Q7"); })();
    </script>

    <style>
        :root { --primary: #244381; --secondary: #8DC53F; --bg: #f4f7f6; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 20px 15px; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; }
        .card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); text-align: center; }
        .brand-header { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9; }
        .brand-logo-img { max-height: 55px; width: auto; display: block; margin: 0 auto 12px; }
        .brand-title { font-size: 13px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        h2 { font-size: 20px; color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; color: #64748b; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 15px; text-transform: uppercase; margin-top: 10px; }
        .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; }
        .instr-text { text-align: left; font-size: 15px; line-height: 1.7; color: #475569; margin-bottom: 25px; background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        .progress-w { height: 6px; background: var(--border); border-radius: 10px; margin: 25px 0; overflow: hidden; }
        .progress-b { height: 100%; background: var(--secondary); transition: width 0.4s; }
        .word-grid { display: grid; gap: 8px; }
        .word-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
        .btn-choice { border: 1px solid var(--border); background: white; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-weight: 600; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .btn-choice.plus.active { background: #dcfce7; color: #166534; border-color: #166534; }
        .btn-choice.minus.active { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="card"><div class="loader"></div><p>Загрузка системы...</p></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7hWzafvWz28vSGzG9RakaUSr375VmA-o",
        authDomain: "sysevolve-platform.firebaseapp.com",
        projectId: "sysevolve-platform",
        storageBucket: "sysevolve-platform.firebasestorage.app",
        messagingSenderId: "1087336122097",
        appId: "1:1087336122097:web:a2f724106e23f82deccb50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const questions = [
        { options: [{t:"Мягкий",v:"S"}, {t:"Убедительный",v:"I"}, {t:"Скромный",v:"C"}, {t:"Решительный",v:"D"}] },
        { options: [{t:"Послушный",v:"C"}, {t:"Жизнерадостный",v:"I"}, {t:"Настойчивый",v:"D"}, {t:"Миролюбивый",v:"S"}] },
        { options: [{t:"Привлекательный",v:"I"}, {t:"Придирчивый",v:"C"}, {t:"Упрямый",v:"D"}, {t:"Спокойный",v:"S"}] },
        { options: [{t:"Предупредительный",v:"S"}, {t:"Открытый",v:"I"}, {t:"Волевой",v:"D"}, {t:"Вежливый",v:"C"}] },
        { options: [{t:"Предприимчивый",v:"D"}, {t:"Довольный",v:"S"}, {t:"Общительный",v:"I"}, {t:"Сдержанный",v:"C"}] },
        { options: [{t:"Кроткий",v:"S"}, {t:"Убежденный",v:"D"}, {t:"Добродушный",v:"I"}, {t:"Аккуратный",v:"C"}] },
        { options: [{t:"Выразительный",v:"I"}, {t:"Осторожный",v:"C"}, {t:"Сильный",v:"D"}, {t:"Уступчивый",v:"S"}] },
        { options: [{t:"Доброжелательный",v:"I"}, {t:"Скрупулезный",v:"C"}, {t:"Уверенный",v:"D"}, {t:"Снисходительный",v:"S"}] },
        { options: [{t:"Деликатный",v:"C"}, {t:"Аргументирующий",v:"D"}, {t:"Адаптивный",v:"S"}, {t:"Веселый",v:"I"}] },
        { options: [{t:"Агрессивный",v:"D"}, {t:"Душа компании",v:"I"}, {t:"Дружелюбный",v:"S"}, {t:"Боязливый",v:"C"}] },
        { options: [{t:"Осторожный",v:"C"}, {t:"Решительный",v:"D"}, {t:"Обаятельный",v:"I"}, {t:"Покладистый",v:"S"}] },
        { options: [{t:"Уверенный",v:"I"}, {t:"Дисциплинированный",v:"C"}, {t:"Щедрый",v:"S"}, {t:"Напористый",v:"D"}] },
        { options: [{t:"Требовательный",v:"D"}, {t:"Эмоциональный",v:"I"}, {t:"Преданный",v:"S"}, {t:"Исполнительный",v:"C"}] },
        { options: [{t:"Приятный",v:"I"}, {t:"Точный",v:"C"}, {t:"Прямолинейный",v:"D"}, {t:"Уравновешенный",v:"S"}] },
        { options: [{t:"Нетерпеливый",v:"D"}, {t:"Радивый",v:"C"}, {t:"Убеждающий",v:"I"}, {t:"Мирный",v:"S"}] },
        { options: [{t:"Логичный",v:"C"}, {t:"Смелый",v:"D"}, {t:"Верный",v:"S"}, {t:"Популярный",v:"I"}] },
        { options: [{t:"Выдержанный",v:"S"}, {t:"Готовый к риску",v:"D"}, {t:"Красноречивый",v:"I"}, {t:"Тактичный",v:"C"}] },
        { options: [{t:"Властный",v:"D"}, {t:"Влиятельный",v:"I"}, {t:"Покладистый",v:"S"}, {t:"Скромный",v:"C"}] },
        { options: [{t:"Уважительный",v:"C"}, {t:"Новаторский",v:"D"}, {t:"Оптимистичный",v:"I"}, {t:"Услужливый",v:"S"}] },
        { options: [{t:"Дипломатичный",v:"C"}, {t:"Удовлетворенный",v:"S"}, {t:"Энергичный",v:"D"}, {t:"Вдохновляющий",v:"I"}] },
        { options: [{t:"Дисциплинированный",v:"C"}, {t:"Смелый",v:"D"}, {t:"Верный",v:"S"}, {t:"Популярный",v:"I"}] },
        { options: [{t:"Мягкий",v:"S"}, {t:"Убедительный",v:"I"}, {t:"Скромный",v:"C"}, {t:"Решительный",v:"D"}] },
        { options: [{t:"Застенчивый",v:"C"}, {t:"Инициативный",v:"D"}, {t:"Стабильный",v:"S"}, {t:"Жизнерадостный",v:"I"}] },
        { options: [{t:"Прямой",v:"D"}, {t:"Душевный",v:"S"}, {t:"Интересный",v:"I"}, {t:"Тщательный",v:"C"}] }
    ];

    let currentIdx = 0;
    let userToken = "";
    let userData = {};
    let choices = [];
    const appDiv = document.getElementById('app');

    const headerHTML = `
        <header class="brand-header">
            <img src="https://raw.githubusercontent.com/againer501/sysevolve-app/main/logo.jpg" class="brand-logo-img" onerror="this.src='https://via.placeholder.com/200x50?text=SYSEVOLVE';">
            <div class="brand-title">Профиль Личности DISC</div>
        </header>
    `;

    async function init() {
        const params = new URLSearchParams(window.location.search);
        userToken = params.get('token');
        if (!userToken) return showError("Токен отсутствует.");
        try {
            const snap = await getDoc(doc(db, "tokens", userToken));
            if (!snap.exists() || snap.data().used) return showError("Ссылка недействительна.");
            renderForm(snap.data().name);
        } catch (e) { showError("Ошибка сети."); }
    }

    // ЭКРАН 1: ФОРМА
    function renderForm(dbName) {
        appDiv.innerHTML = `
            <div class="card">
                ${headerHTML}
                <h2>Регистрация</h2>
                <form id="reg-form">
                    <div class="form-group"><label>Имя *</label><input type="text" id="f-name" value="${dbName || ''}" required></div>
                    <div class="form-group"><label>Фамилия *</label><input type="text" id="f-surname" required></div>
                    <div class="form-group"><label>Электронная почта *</label><input type="email" id="f-email" required></div>
                    <div class="form-group"><label>Организация</label><input type="text" id="f-company"></div>
                    <div class="form-group"><label>Должность</label><input type="text" id="f-position"></div>
                    <button type="button" id="to-instr" class="btn-main">Далее</button>
                </form>
            </div>
        `;
        document.getElementById('to-instr').onclick = () => {
            const name = document.getElementById('f-name').value;
            const surname = document.getElementById('f-surname').value;
            const email = document.getElementById('f-email').value;
            if(!name || !surname || !email) return alert("Пожалуйста, заполните обязательные поля");
            
            userData = {
                name, surname, email,
                company: document.getElementById('f-company').value,
                position: document.getElementById('f-position').value
            };
            renderInstructions();
        };
    }

    // ЭКРАН 2: ИНСТРУКЦИЯ
    function renderInstructions() {
        appDiv.innerHTML = `
            <div class="card">
                ${headerHTML}
                <h2>Инструкция</h2>
                <div class="instr-text">
                    Этот опросник содержит 24 группы утверждений. В каждой группе:<br><br>
                    1. Выберите одно слово, которое <b>наиболее</b> точно описывает Вас <b>(+)</b>.<br>
                    2. Выберите одно слово, которое <b>наименее</b> точно описывает Вас <b>(-)</b>.<br><br>
                    Пожалуйста, отвечайте быстро, основываясь на первом впечатлении.
                </div>
                <button type="button" id="start-test" class="btn-main">Приступить к тесту</button>
            </div>
        `;
        document.getElementById('start-test').onclick = () => { renderQuiz(); };
    }

    // ЭКРАН 3: ТЕСТ
    function renderQuiz() {
        const q = questions[currentIdx];
        const progress = (currentIdx / questions.length) * 100;
        appDiv.innerHTML = `
            <div class="card">
                ${headerHTML}
                <div class="progress-w"><div class="progress-b" style="width: ${progress}%"></div></div>
                <div class="word-grid">
                    ${q.options.map((opt, i) => `
                        <div class="word-item">
                            <span style="font-weight:600;">${opt.t}</span>
                            <div style="display:flex; gap:10px;">
                                <button class="btn-choice plus" id="p-${i}">+</button>
                                <button class="btn-choice minus" id="m-${i}">-</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button id="next-btn" class="btn-main" disabled style="margin-top:20px;">Следующий этап</button>
                <div style="margin-top:10px; font-size:12px; color:#94a3b8;">Вопрос ${currentIdx+1} из 24</div>
            </div>
        `;

        // Логика выбора внутри вопроса
        q.options.forEach((opt, i) => {
            document.getElementById(`p-${i}`).onclick = () => selectChoice(i, 'plus');
            document.getElementById(`m-${i}`).onclick = () => selectChoice(i, 'minus');
        });
        document.getElementById('next-btn').onclick = goNext;
    }

    function selectChoice(idx, type) {
        if(!choices[currentIdx]) choices[currentIdx] = {};
        choices[currentIdx][type] = questions[currentIdx].options[idx];
        
        const group = type === 'plus' ? 'p-' : 'm-';
        for(let i=0; i<4; i++) { document.getElementById(group+i).classList.remove('active'); }
        document.getElementById(group+idx).classList.add('active');
        
        const c = choices[currentIdx];
        document.getElementById('next-btn').disabled = !(c.plus && c.minus && c.plus.t !== c.minus.t);
    }

    function goNext() {
        currentIdx++;
        if (currentIdx < questions.length) renderQuiz();
        else finish();
    }

    async function finish() {
        appDiv.innerHTML = '<div class="card"><div class="loader"></div><p>Обработка и отправка результатов...</p></div>';
        const g1 = {D:0,I:0,S:0,C:0}, g2 = {D:0,I:0,S:0,C:0}, wl = [];
        choices.forEach((c, i) => {
            if(c.plus) g1[c.plus.v]++;
            if(c.minus) g2[c.minus.v]++;
            wl.push(`${i+1}. +${c.plus.t} / -${c.minus.t}`);
        });
        const g3 = {D: g1.D-g2.D, I: g1.I-g2.I, S: g1.S-g2.S, C: g1.C-g2.C};

        try {
            await updateDoc(doc(db, "tokens", userToken), { 
                results: { g1, g2, g3 }, 
                userDetails: userData, 
                used: true,
                finishedAt: new Date().toISOString()
            });

            await emailjs.send("service_4wwl3xh", "template_7muk9at", {
                user_name: `${userData.name} ${userData.surname}`,
                user_email: userData.email,
                company: userData.company || "-",
                position: userData.position || "-",
                results_summary: `D:${g3.D}, I:${g3.I}, S:${g3.S}, C:${g3.C}`,
                word_list: wl.join("\n")
            });

            appDiv.innerHTML = `<div class="card">${headerHTML}<div style="color:var(--secondary); font-size: 50px;">✓</div><h2>Тест завершен!</h2><p>Ваши ответы успешно отправлены. Спасибо!</p></div>`;
        } catch (e) { showError("Ошибка при сохранении данных."); }
    }

    function showError(m) { appDiv.innerHTML = `<div class="card"><h2>Ошибка</h2><p>${m}</p></div>`; }
    init();
</script>
</body>
</html>
