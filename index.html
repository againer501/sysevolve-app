<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSEVOLVE | DISC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #244381; --secondary: #8DC53F; --bg: #f4f7f6; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 20px 15px; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; }
        .card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); text-align: center; }
        
        /* УМЕНЬШЕННАЯ ШАПКА */
        .brand-header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9; }
        .brand-logo-img { max-height: 45px; width: auto; display: block; margin: 0 auto 10px; }
        .brand-title { font-size: 14px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }

        @media (max-width: 480px) { 
            .card { padding: 20px 15px; } 
            .brand-title { font-size: 12px; } 
            .brand-logo-img { max-height: 38px; } 
        }

        h2 { font-size: 20px; color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; color: #64748b; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 15px; text-transform: uppercase; margin-top: 10px; }
        .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; }

        .progress-w { height: 6px; background: var(--border); border-radius: 10px; margin: 25px 0; overflow: hidden; }
        .progress-b { height: 100%; background: var(--secondary); transition: width 0.4s; }
        
        .word-grid { display: grid; gap: 8px; }
        .word-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; }
        .btn-choice { border: 1px solid var(--border); background: white; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-weight: 600; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .btn-choice.plus.active { background: #dcfce7; color: #166534; border-color: #166534; }
        .btn-choice.minus.active { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .instr-text { text-align: left; font-size: 14px; line-height: 1.6; color: #1e293b; }
        .instr-text h3 { color: #8DC53F; font-size: 18px; margin-bottom: 10px; }
        .instr-text h4 { color: #244381; font-size: 18px; margin: 15px 0 10px 0; }
        .instr-list { padding-left: 20px; }
        .instr-list li { margin-bottom: 8px; }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="card"><div class="loader"></div><p>Загрузка системы...</p></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7hWzafvWz28vSGzG9RakaUSr375VmA-o",
        authDomain: "sysevolve-platform.firebaseapp.com",
        projectId: "sysevolve-platform",
        storageBucket: "sysevolve-platform.firebasestorage.app",
        messagingSenderId: "1087336122097",
        appId: "1:1087336122097:web:a2f724106e23f82deccb50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const questions = [
        { options: [{t:"Мягкий",v:"S"}, {t:"Убедительный",v:"I"}, {t:"Скромный",v:"C"}, {t:"Решительный",v:"D"}] },
        { options: [{t:"Послушный",v:"C"}, {t:"Жизнерадостный",v:"I"}, {t:"Настойчивый",v:"D"}, {t:"Миролюбивый",v:"S"}] },
        { options: [{t:"Привлекательный",v:"I"}, {t:"Придирчивый",v:"C"}, {t:"Упрямый",v:"D"}, {t:"Спокойный",v:"S"}] },
        { options: [{t:"Предупредительный",v:"S"}, {t:"Открытый",v:"I"}, {t:"Волевой",v:"D"}, {t:"Вежливый",v:"C"}] },
        { options: [{t:"Предприимчивый",v:"D"}, {t:"Довольный",v:"S"}, {t:"Общительный",v:"I"}, {t:"Сдержанный",v:"C"}] },
        { options: [{t:"Кроткий",v:"S"}, {t:"Убежденный",v:"D"}, {t:"Добродушный",v:"I"}, {t:"Аккуратный",v:"C"}] },
        { options: [{t:"Выразительный",v:"I"}, {t:"Осторожный",v:"C"}, {t:"Сильный",v:"D"}, {t:"Уступчивый",v:"S"}] },
        { options: [{t:"Доброжелательный",v:"I"}, {t:"Скрупулезный",v:"C"}, {t:"Уверенный",v:"D"}, {t:"Снисходительный",v:"S"}] },
        { options: [{t:"Деликатный",v:"C"}, {t:"Аргументирующий",v:"D"}, {t:"Адаптивный",v:"S"}, {t:"Веселый",v:"I"}] },
        { options: [{t:"Агрессивный",v:"D"}, {t:"Душа компании",v:"I"}, {t:"Дружелюбный",v:"S"}, {t:"Боязливый",v:"C"}] },
        { options: [{t:"Осторожный",v:"C"}, {t:"Решительный",v:"D"}, {t:"Обаятельный",v:"I"}, {t:"Покладистый",v:"S"}] },
        { options: [{t:"Уверенный",v:"I"}, {t:"Дисциплинированный",v:"C"}, {t:"Щедрый",v:"S"}, {t:"Напористый",v:"D"}] },
        { options: [{t:"Требовательный",v:"D"}, {t:"Эмоциональный",v:"I"}, {t:"Преданный",v:"S"}, {t:"Исполнительный",v:"C"}] },
        { options: [{t:"Приятный",v:"I"}, {t:"Точный",v:"C"}, {t:"Прямолинейный",v:"D"}, {t:"Уравновешенный",v:"S"}] },
        { options: [{t:"Нетерпеливый",v:"D"}, {t:"Радивый",v:"C"}, {t:"Убеждающий",v:"I"}, {t:"Мирный",v:"S"}] },
        { options: [{t:"Логичный",v:"C"}, {t:"Смелый",v:"D"}, {t:"Верный",v:"S"}, {t:"Популярный",v:"I"}] },
        { options: [{t:"Выдержанный",v:"S"}, {t:"Готовый к риску",v:"D"}, {t:"Красноречивый",v:"I"}, {t:"Тактичный",v:"C"}] },
        { options: [{t:"Властный",v:"D"}, {t:"Влиятельный",v:"I"}, {t:"Покладистый",v:"S"}, {t:"Скромный",v:"C"}] },
        { options: [{t:"Уважительный",v:"C"}, {t:"Новаторский",v:"D"}, {t:"Оптимистичный",v:"I"}, {t:"Услужливый",v:"S"}] },
        { options: [{t:"Дипломатичный",v:"C"}, {t:"Удовлетворенный",v:"S"}, {t:"Энергичный",v:"D"}, {t:"Вдохновляющий",v:"I"}] },
        { options: [{t:"Дисциплинированный",v:"C"}, {t:"Смелый",v:"D"}, {t:"Верный",v:"S"}, {t:"Популярный",v:"I"}] },
        { options: [{t:"Мягкий",v:"S"}, {t:"Убедительный",v:"I"}, {t:"Скромный",v:"C"}, {t:"Решительный",v:"D"}] },
        { options: [{t:"Застенчивый",v:"C"}, {t:"Инициативный",v:"D"}, {t:"Стабильный",v:"S"}, {t:"Жизнерадостный",v:"I"}] },
        { options: [{t:"Прямой",v:"D"}, {t:"Душевный",v:"S"}, {t:"Интересный",v:"I"}, {t:"Тщательный",v:"C"}] }
    ];

    let currentIdx = 0;
    let userToken = "";
    let userData = {};
    let choices = [];
    const appDiv = document.getElementById('app');

    const headerHTML = `
        <header class="brand-header">
            <img src="logo.jpg" alt="SYSEVOLVE" class="brand-logo-img" 
                 onerror="this.src='https://firebasestorage.googleapis.com/v0/b/sysevolve-platform.appspot.com/o/public%2Flogo.png?alt=media';">
            <div class="brand-title">Профиль Личности DISC</div>
        </header>
    `;

    async function init() {
        const params = new URLSearchParams(window.location.search);
        userToken = params.get('token');
        if (!userToken) return showError("Токен отсутствует.");
        try {
            const snap = await getDoc(doc(db, "tokens", userToken));
            if (!snap.exists() || snap.data().used) return showError("Ссылка недействительна.");
            renderForm(snap.data().name);
        } catch (e) { showError("Ошибка сети."); }
    }

    function renderForm(dbName) {
        appDiv.innerHTML = `
            <div class="card">
                ${headerHTML}
                <h2>Регистрация</h2>
                <form id="reg-form">
                    <div class="form-group"><label>Имя *</label><input type="text" id="f-name" value="${dbName || ''}" required></div>
                    <div class="form-group"><label>Фамилия *</label><input type="text" id="f-surname" required></div>
                    <div class="form-group"><label>Электронная почта *</label><input type="email" id="f-email" required></div>
                    <div class="form-group"><label>Название организации</label><input type="text" id="f-company"></div>
                    <div class="form-group"><label>Должность</label><input type="text" id="f-position"></div>
                    <button type="submit" class="btn-main">Продолжить</button>
                </form>
            </div>
        `;
        document.getElementById('reg-form').onsubmit = (e) => {
            e.preventDefault();
            userData = {
                name: document.getElementById('f-name').value, 
                surname: document.getElementById('f-surname').value,
                email: document.getElementById('f-email').value, 
                company: document.getElementById('f-company').value,
                position: document.getElementById('f-position').value
            };
            renderInstruction();
        };
    }

    function renderInstruction() {
        appDiv.innerHTML = `
            <div class="card">
                ${headerHTML}
                <div class="instr-text">
                    <h3>Профиль Личности DISC</h3>
                    <h4>Добро пожаловать</h4>
                    <p>Профиль Личности DISC создан для определения предпочитаемого человеком стиля поведения в рабочей среде.</p>
                    <p><b>Это не тест.</b> Здесь нет 'правильных' или 'неправильных' ответов. Результаты исследования акцентируют внимание на Ваших сильных сторонах в работе.</p>
                    <p>Анкету необходимо заполнять в одиночестве и не отвлекаясь. Постарайтесь отвечать спонтанно и честно.</p>
                    <p>При заполнении анкеты <b>думайте о себе на текущей работе</b>; если Вы не работаете, думайте о себе на последнем месте работы. Если никогда не работали — о себе дома.</p>
                    
<h3 style="color:var(--primary); margin-top:20px;">Инструкция</h3>
                    <div style="background:#f8fafc; padding:15px; border-radius:12px; border:1px solid var(--border);">
                        <ol style="padding-left:20px; margin:0;">
                            <li style="margin-bottom:8px;">В каждой группе выберите слово, которое <b>НАИБОЛЕЕ (+)</b> характеризует Вас.</li>
                            <li style="margin-bottom:8px;">Затем выберите слово, которое <b>НАИМЕНЕЕ (-)</b> характеризует Вас.</li>
                            <li>Нажмите кнопку «Далее» для перехода к следующей группе.</li>
                    </ol>
                </div>
                <button class="btn-main" style="margin-top:20px;" onclick="window.startQuiz()">Начать заполнение</button>
            </div>
        `;
    }

    window.startQuiz = () => renderQuiz();

    window.select = (idx, type) => {
        if(!choices[currentIdx]) choices[currentIdx] = {};
        choices[currentIdx][type] = questions[currentIdx].options[idx].v;
        const group = type === 'plus' ? 'p-' : 'm-';
        for(let i=0; i<4; i++) {
            const el = document.getElementById(group+i);
            if(el) el.classList.remove('active');
        }
        document.getElementById(group+idx).classList.add('active');
        const btn = document.getElementById('next-btn');
        if(choices[currentIdx].plus && choices[currentIdx].minus) {
            btn.disabled = (choices[currentIdx].plus === choices[currentIdx].minus);
        }
    };

    window.goNext = () => {
        currentIdx++;
        if (currentIdx < questions.length) renderQuiz();
        else finish();
    };

    function renderQuiz() {
        const q = questions[currentIdx];
        const progress = (currentIdx / questions.length) * 100;
        appDiv.innerHTML = `
            <div class="card">
                ${headerHTML}
                <div class="progress-w"><div class="progress-b" style="width: ${progress}%"></div></div>
                <div class="word-grid">
                    ${q.options.map((opt, i) => `
                        <div class="word-item">
                            <span style="font-weight:600; color:#334155;">${opt.t}</span>
                            <div style="display:flex; gap:10px;">
                                <button class="btn-choice plus" id="p-${i}" onclick="window.select(${i}, 'plus')">+</button>
                                <button class="btn-choice minus" id="m-${i}" onclick="window.select(${i}, 'minus')">-</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top:25px; display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:13px; color:#64748b;">Группа ${currentIdx+1} из 24</span>
                    <button id="next-btn" class="btn-main" style="width:auto; padding:12px 30px; margin:0;" disabled onclick="window.goNext()">Далее</button>
                </div>
            </div>
        `;
    }

    async function finish() {
        appDiv.innerHTML = '<div class="card"><div class="loader"></div><p>Сохранение результатов...</p></div>';
        const scores = choices.reduce((acc, curr) => {
            acc[curr.plus]++; acc[curr.minus]--; return acc;
        }, { D: 0, I: 0, S: 0, C: 0 });
        try {
            await updateDoc(doc(db, "tokens", userToken), { 
                results: scores, userDetails: userData, used: true, finishedAt: new Date().toISOString() 
            });
            appDiv.innerHTML = `<div class="card">${headerHTML}<div style="color:var(--secondary); font-size: 50px; margin: 20px 0;">✓</div><h2>Завершено!</h2><p>Ваши данные успешно сохранены. Спасибо!</p></div>`;
        } catch (e) { showError("Ошибка сохранения."); }
    }

    function showError(m) { appDiv.innerHTML = `<div class="card"><h2>Ошибка</h2><p>${m}</p></div>`; }
    init();
</script>
</body>
</html>
