<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sysevolve Test</title>
</head>
<body>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7hWzafvWz28vSGzG9RakaUSr375VmA-o",
        authDomain: "sysevolve-platform.firebaseapp.com",
        projectId: "sysevolve-platform",
        storageBucket: "sysevolve-platform.firebasestorage.app",
        messagingSenderId: "1087336122097",
        appId: "1:1087336122097:web:a2f724106e23f82deccb50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Скрываем интерфейс пока идет проверка
    document.body.innerHTML = '<div id="loader" style="text-align:center; margin-top:100px;">Проверка доступа...</div>';

    window.onload = async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError("Доступ запрещен. Используйте персональную ссылку.");
            return;
        }

        try {
            const docRef = doc(db, "tokens", token);
            const docSnap = await getDoc(docRef);

            if (!docSnap.exists()) {
                showError("Ссылка недействительна.");
            } else if (docSnap.data().used === true) {
                showError("Этот тест уже был пройден ранее.");
            } else {
                window.userToken = token;
                // Показываем тест только если токен ок
                showTestUI(docSnap.data().name);
            }
        } catch (e) {
            console.error(e);
            showError("Ошибка подключения к облаку.");
        }
    };

    window.finishTest = async function(answers) {
        try {
            const docRef = doc(db, "tokens", window.userToken);
            await updateDoc(docRef, {
                results: answers,
                used: true,
                finishedAt: new Date().toISOString()
            });
            document.body.innerHTML = "<h1 style='text-align:center; padding:50px; font-family:sans-serif;'>Тест завершен. Спасибо!</h1>";
        } catch (error) {
            alert("Ошибка сохранения.");
        }
    };

    function showTestUI(userName) {
        document.body.innerHTML = `
            <div style="max-width: 500px; margin: 50px auto; font-family: sans-serif; text-align: center; border: 1px solid #ddd; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <h2 style="color: #007bff;">Здравствуйте, ${userName}!</h2>
                <p>Система Sysevolve готова к работе. Нажмите кнопку ниже для завершения проверки.</p>
                <button onclick="window.finishTest({'status': 'verified'})" style="background-color: #28a745; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer;">
                    Отправить результат
                </button>
            </div>`;
    }

    function showError(msg) {
        document.body.innerHTML = `
            <div style="text-align:center; margin-top:100px; font-family:sans-serif;">
                <h1 style="color:red;">⚠</h1>
                <h2>${msg}</h2>
            </div>`;
    }
</script>

</body>
</html>
