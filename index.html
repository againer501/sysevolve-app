<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysevolve - Тестирование</title>
    <style>
        :root { --primary-color: #007bff; --bg-color: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app { width: 100%; max-width: 600px; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); margin-bottom: 30px; letter-spacing: 1px; }
        .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 30px; overflow: hidden; }
        .progress-inner { height: 100%; background: var(--primary-color); transition: width 0.3s ease; }
        h2 { font-size: 20px; color: #333; margin-bottom: 25px; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid #eee; padding: 15px; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 16px; text-align: left; }
        .option-btn:hover { border-color: var(--primary-color); background: #f0f7ff; }
        .error { color: #dc3545; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app">
    <div class="card">
        <div class="loader"></div>
        <p>Загрузка теста...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7hWzafvWz28vSGzG9RakaUSr375VmA-o",
        authDomain: "sysevolve-platform.firebaseapp.com",
        projectId: "sysevolve-platform",
        storageBucket: "sysevolve-platform.firebasestorage.app",
        messagingSenderId: "1087336122097",
        appId: "1:1087336122097:web:a2f724106e23f82deccb50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- НАСТРОЙКА ВОПРОСОВ (Возьмите их из скриншотов) ---
    const quizData = [
        {
            question: "Вопрос 1: Как вы оцениваете эффективность текущих процессов?",
            options: ["Высокая", "Средняя", "Низкая", "Затрудняюсь ответить"]
        },
        {
            question: "Вопрос 2: Укажите ваш приоритет развития на текущий год.",
            options: ["Масштабирование", "Оптимизация затрат", "Цифровизация", "Обучение персонала"]
        }
        // Сюда добавьте остальные вопросы по образцу
    ];

    let currentStep = 0;
    let answers = {};
    let userToken = "";
    const display = document.getElementById('app');

    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        userToken = urlParams.get('token');

        if (!userToken) {
            renderError("Доступ запрещен. Ссылка не содержит токен.");
            return;
        }

        try {
            const docSnap = await getDoc(doc(db, "tokens", userToken));
            if (!docSnap.exists()) {
                renderError("Невалидная ссылка.");
            } else if (docSnap.data().used) {
                renderError("Этот тест уже был пройден.");
            } else {
                renderStep();
            }
        } catch (e) {
            renderError("Ошибка связи с базой.");
        }
    }

    function renderStep() {
        const progress = (currentStep / quizData.length) * 100;
        const q = quizData[currentStep];

        display.innerHTML = `
            <div class="card">
                <div class="logo">SYSEVOLVE</div>
                <div class="progress-bar"><div class="progress-inner" style="width: ${progress}%"></div></div>
                <h2>${q.question}</h2>
                <div class="options">
                    ${q.options.map(opt => `<button class="option-btn" onclick="next('${opt}')">${opt}</button>`).join('')}
                </div>
            </div>
        `;
    }

    window.next = async (answer) => {
        answers[`q${currentStep + 1}`] = answer;
        currentStep++;

        if (currentStep < quizData.length) {
            renderStep();
        } else {
            complete();
        }
    };

    async function complete() {
        display.innerHTML = '<div class="card"><div class="loader"></div><p>Сохранение результатов...</p></div>';
        try {
            await updateDoc(doc(db, "tokens", userToken), {
                results: answers,
                used: true,
                finishedAt: new Date().toISOString()
            });
            display.innerHTML = `
                <div class="card">
                    <div class="logo" style="color: #28a745;">УСПЕШНО</div>
                    <h2>Благодарим за прохождение!</h2>
                    <p>Ваши ответы переданы экспертам Sysevolve.</p>
                </div>`;
        } catch (e) {
            renderError("Ошибка при сохранении.");
        }
    }

    function renderError(msg) {
        display.innerHTML = `<div class="card"><h2 class="error">⚠ Ошибка</h2><p>${msg}</p></div>`;
    }

    init();
</script>

</body>
</html>
