<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysevolve Test</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f7f6; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .error { color: #d9534f; }
        button { background: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="app">
    <div class="card">
        <h3>Загрузка системы...</h3>
        <p>Пожалуйста, подождите.</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7hWzafvWz28vSGzG9RakaUSr375VmA-o",
        authDomain: "sysevolve-platform.firebaseapp.com",
        projectId: "sysevolve-platform",
        storageBucket: "sysevolve-platform.firebasestorage.app",
        messagingSenderId: "1087336122097",
        appId: "1:1087336122097:web:a2f724106e23f82deccb50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function start() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const display = document.getElementById('app');

        if (!token) {
            display.innerHTML = '<div class="card"><h2 class="error">Ошибка</h2><p>Токен не найден в ссылке.</p></div>';
            return;
        }

        try {
            const docRef = doc(db, "tokens", token);
            const docSnap = await getDoc(docRef);

            if (!docSnap.exists()) {
                display.innerHTML = `<div class="card"><h2 class="error">Ошибка</h2><p>Токен <b>${token}</b> не найден в базе.</p></div>`;
            } else if (docSnap.data().used === true) {
                display.innerHTML = '<div class="card"><h2>Тест завершен</h2><p>Эта ссылка была использована ранее.</p></div>';
            } else {
                display.innerHTML = `
                    <div class="card">
                        <h2>Привет, ${docSnap.data().name}!</h2>
                        <p>Нажмите кнопку ниже, чтобы отправить тестовое подтверждение в базу Sysevolve.</p>
                        <button id="finishBtn">Отправить результат</button>
                    </div>`;
                
                document.getElementById('finishBtn').onclick = async () => {
                    await updateDoc(docRef, { used: true, finishedAt: new Date().toISOString() });
                    display.innerHTML = '<div class="card"><h2>Готово!</h2><p>Данные успешно сохранены.</p></div>';
                };
            }
        } catch (e) {
            display.innerHTML = `<div class="card"><h2 class="error">Ошибка Firebase</h2><p>${e.message}</p></div>`;
        }
    }

    start();
</script>

</body>
</html>
