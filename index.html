<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSEVOLVE | DISC Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { --primary: #244381; --secondary: #8DC53F; --bg: #f4f7f6; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 20px 15px; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); text-align: center; }
        .brand-header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9; }
        .brand-logo-img { max-height: 45px; width: auto; display: block; margin: 0 auto 10px; }
        .brand-title { font-size: 14px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }

        .step-content { display: none; }
        .step-content.active { display: block; }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 13px; color: #64748b; }
        input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 15px; text-transform: uppercase; margin-top: 15px; }
        .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; }

        .instr-text { text-align: left; font-size: 14px; line-height: 1.5; color: #1e293b; margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); }
        .instr-text h3 { color: var(--secondary); font-size: 17px; margin-bottom: 8px; }
        .instr-text h4 { color: var(--primary); font-size: 16px; margin: 12px 0 8px 0; }
        .instr-list { padding-left: 20px; margin: 0; }
        .instr-list li { margin-bottom: 5px; }

        .progress-w { height: 6px; background: var(--border); border-radius: 10px; margin: 25px 0; overflow: hidden; }
        .progress-b { height: 100%; background: var(--secondary); transition: width 0.4s; }
        .word-grid { display: grid; gap: 8px; }
        .word-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
        .btn-choice { border: 1px solid var(--border); background: white; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-weight: 600; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .btn-choice.plus.active { background: #dcfce7; color: #166534; border-color: #166534; }
        .btn-choice.minus.active { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="card">
        <header class="brand-header">
            <img src="https://raw.githubusercontent.com/againer501/sysevolve-app/main/logo.jpg" class="brand-logo-img" alt="SYSEVOLVE">
            <div class="brand-title">Профиль Личности DISC</div>
        </header>

        <div id="step-start" class="step-content active">
            <h2>Регистрация</h2>
            <div class="form-group"><label>Имя *</label><input type="text" id="f-name" required></div>
            <div class="form-group"><label>Фамилия *</label><input type="text" id="f-surname" required></div>
            <div class="form-group"><label>Электронная почта *</label><input type="email" id="f-email" required></div>
            <div class="form-group"><label>Название организации</label><input type="text" id="f-company"></div>
            <div class="form-group"><label>Должность</label><input type="text" id="f-position"></div>

            <div class="instr-text">
                <h3>Инструкция</h3>
                <p>Профиль DISC определяет ваш стиль поведения в рабочей среде. <b>Это не тест</b>, здесь нет правильных ответов.</p>
                <div style="background:#f8fafc; padding:12px; border-radius:10px; border:1px solid var(--border);">
                    <ol class="instr-list">
                        <li>Выберите слово, которое <b>НАИБОЛЕЕ (+)</b> характеризует Вас.</li>
                        <li>Выберите слово, которое <b>НАИМЕНЕЕ (-)</b> характеризует Вас.</li>
                    </ol>
                </div>
            </div>
            
            <button type="button" class="btn-main" onclick="startQuiz()">Начать заполнение</button>
        </div>

        <div id="step-quiz" class="step-content">
            <div class="progress-w"><div id="p-bar" class="progress-b" style="width: 0%"></div></div>
            <div id="quiz-container"></div>
            <div style="margin-top:25px; display:flex; justify-content:space-between; align-items:center;">
                <span id="q-counter" style="font-size:13px; color:#64748b;"></span>
                <button id="next-btn" class="btn-main" style="width:auto; padding:12px 30px; margin:0;" disabled onclick="goNext()">Далее</button>
            </div>
        </div>

        <div id="step-final" class="step-content">
            <div id="final-status">
                <div class="loader"></div>
                <p>Сохранение...</p>
            </div>
        </div>
    </div>
</div>
