<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysevolve | Инструкция PPA</title>
    <style>
        :root { --primary: #244381; --secondary: #8DC53F; --bg: #f4f7f6; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .logo { font-size: 26px; font-weight: 800; color: var(--primary); margin-bottom: 20px; letter-spacing: 2px; }
        
        /* Стили инструкции */
        .instruction-box { text-align: left; background: #f8fafc; padding: 25px; border-radius: 12px; border-left: 5px solid var(--secondary); margin-bottom: 30px; }
        .instruction-box h3 { margin-top: 0; color: var(--primary); }
        .instruction-box ul { padding-left: 20px; }
        .instruction-box li { margin-bottom: 10px; line-height: 1.4; }

        .progress-container { height: 8px; background: #e2e8f0; border-radius: 4px; margin: 25px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--secondary); transition: width 0.4s ease; }
        
        .word-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .word-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border: 1px solid #e2e8f0; border-radius: 12px; }
        .word-text { font-weight: 600; font-size: 16px; }
        
        .btn-choice { border: 1px solid #cbd5e1; background: white; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-choice.plus.active { background: #dcfce7; color: #166534; border-color: #166534; }
        .btn-choice.minus.active { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        
        button#start-btn, button#next-btn { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button#next-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="card"><div class="loader"></div><p>Загрузка профиля...</p></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7hWzafvWz28vSGzG9RakaUSr375VmA-o",
        authDomain: "sysevolve-platform.firebaseapp.com",
        projectId: "sysevolve-platform",
        storageBucket: "sysevolve-platform.firebasestorage.app",
        messagingSenderId: "1087336122097",
        appId: "1:1087336122097:web:a2f724106e23f82deccb50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const questions = [
        { options: [{t:"Мягкий",v:"S"}, {t:"Убедительный",v:"I"}, {t:"Скромный",v:"C"}, {t:"Решительный",v:"D"}] },
        { options: [{t:"Послушный",v:"C"}, {t:"Жизнерадостный",v:"I"}, {t:"Настойчивый",v:"D"}, {t:"Миролюбивый",v:"S"}] },
        { options: [{t:"Привлекательный",v:"I"}, {t:"Придирчивый",v:"C"}, {t:"Упрямый",v:"D"}, {t:"Спокойный",v:"S"}] },
        { options: [{t:"Предупредительный",v:"S"}, {t:"Открытый",v:"I"}, {t:"Волевой",v:"D"}, {t:"Вежливый",v:"C"}] },
        { options: [{t:"Предприимчивый",v:"D"}, {t:"Довольный",v:"S"}, {t:"Общительный",v:"I"}, {t:"Сдержанный",v:"C"}] },
        { options: [{t:"Кроткий",v:"S"}, {t:"Убежденный",v:"D"}, {t:"Добродушный",v:"I"}, {t:"Аккуратный",v:"C"}] },
        { options: [{t:"Выразительный",v:"I"}, {t:"Осторожный",v:"C"}, {t:"Сильный",v:"D"}, {t:"Уступчивый",v:"S"}] },
        { options: [{t:"Доброжелательный",v:"I"}, {t:"Скрупулезный",v:"C"}, {t:"Уверенный",v:"D"}, {t:"Снисходительный",v:"S"}] },
        { options: [{t:"Деликатный",v:"C"}, {t:"Аргументирующий",v:"D"}, {t:"Адаптивный",v:"S"}, {t:"Веселый",v:"I"}] },
        { options: [{t:"Агрессивный",v:"D"}, {t:"Душа компании",v:"I"}, {t:"Дружелюбный",v:"S"}, {t:"Боязливый",v:"C"}] },
        { options: [{t:"Осторожный",v:"C"}, {t:"Решительный",v:"D"}, {t:"Обаятельный",v:"I"}, {t:"Покладистый",v:"S"}] },
        { options: [{t:"Уверенный",v:"I"}, {t:"Дисциплинированный",v:"C"}, {t:"Щедрый",v:"S"}, {t:"Напористый",v:"D"}] },
        { options: [{t:"Требовательный",v:"D"}, {t:"Эмоциональный",v:"I"}, {t:"Преданный",v:"S"}, {t:"Исполнительный",v:"C"}] },
        { options: [{t:"Приятный",v:"I"}, {t:"Точный",v:"C"}, {t:"Прямолинейный",v:"D"}, {t:"Уравновешенный",v:"S"}] },
        { options: [{t:"Нетерпеливый",v:"D"}, {t:"Радивый",v:"C"}, {t:"Убеждающий",v:"I"}, {t:"Мирный",v:"S"}] },
        { options: [{t:"Логичный",v:"C"}, {t:"Смелый",v:"D"}, {t:"Верный",v:"S"}, {t:"Популярный",v:"I"}] },
        { options: [{t:"Выдержанный",v:"S"}, {t:"Готовый к риску",v:"D"}, {t:"Красноречивый",v:"I"}, {t:"Тактичный",v:"C"}] },
        { options: [{t:"Властный",v:"D"}, {t:"Влиятельный",v:"I"}, {t:"Покладистый",v:"S"}, {t:"Скромный",v:"C"}] },
        { options: [{t:"Уважительный",v:"C"}, {t:"Новаторский",v:"D"}, {t:"Оптимистичный",v:"I"}, {t:"Услужливый",v:"S"}] },
        { options: [{t:"Дипломатичный",v:"C"}, {t:"Удовлетворенный",v:"S"}, {t:"Энергичный",v:"D"}, {t:"Вдохновляющий",v:"I"}] },
        { options: [{t:"Дисциплинированный",v:"C"}, {t:"Смелый",v:"D"}, {t:"Верный",v:"S"}, {t:"Популярный",v:"I"}] },
        { options: [{t:"Мягкий",v:"S"}, {t:"Убедительный",v:"I"}, {t:"Скромный",v:"C"}, {t:"Решительный",v:"D"}] },
        { options: [{t:"Застенчивый",v:"C"}, {t:"Инициативный",v:"D"}, {t:"Стабильный",v:"S"}, {t:"Жизнерадостный",v:"I"}] },
        { options: [{t:"Прямой",v:"D"}, {t:"Душевный",v:"S"}, {t:"Интересный",v:"I"}, {t:"Тщательный",v:"C"}] }
    ];

    let currentIdx = 0;
    let userToken = "";
    let userName = "";
    let choices = [];
    const appDiv = document.getElementById('app');

    async function init() {
        const params = new URLSearchParams(window.location.search);
        userToken = params.get('token');
        if (!userToken) return showError("Ошибка доступа.");

        try {
            const snap = await getDoc(doc(db, "tokens", userToken));
            if (!snap.exists() || snap.data().used) return showError("Ссылка более не активна.");
            userName = snap.data().name;
            renderInstruction();
        } catch (e) { showError("Ошибка сети."); }
    }

    // --- НОВЫЙ ШАГ: ЭКРАН ИНСТРУКЦИИ ---
    function renderInstruction() {
        appDiv.innerHTML = `
            <div class="card">
                <div class="logo">SYSEVOLVE</div>
                <h2>Профильный анализ личности</h2>
                <div class="instruction-box">
                    <h3>Инструкция для ${userName}:</h3>
                    <ul>
                        <li>Перед вами будут группы из 4-х слов.</li>
                        <li>В каждой группе выберите <b>одно слово (+)</b>, которое лучше всего описывает ваше поведение на работе.</li>
                        <li>Затем выберите <b>одно слово (-)</b>, которое подходит вам меньше всего.</li>
                        <li>Не раздумывайте долго, первая реакция самая точная.</li>
                    </ul>
                </div>
                <button id="start-btn" onclick="window.startQuiz()">Начать тестирование</button>
            </div>
        `;
    }

    window.startQuiz = () => renderQuiz();

    function renderQuiz() {
        const q = questions[currentIdx];
        const progress = (currentIdx / questions.length) * 100;
        appDiv.innerHTML = `
            <div class="card">
                <div class="logo">SYSEVOLVE</div>
                <div class="progress-container"><div class="progress-bar" style="width: ${progress}%"></div></div>
                <div class="word-grid">
                    ${q.options.map((opt, i) => `
                        <div class="word-item">
                            <span class="word-text">${opt.t}</span>
                            <div style="display:flex; gap:10px;">
                                <button class="btn-choice plus" id="p-${i}" onclick="select(${i}, 'plus')">+</button>
                                <button class="btn-choice minus" id="m-${i}" onclick="select(${i}, 'minus')">-</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top:30px; display:flex; justify-content:space-between; align-items:center;">
                    <span>Группа ${currentIdx+1}/${questions.length}</span>
                    <button id="next-btn" disabled onclick="window.goNext()">Далее</button>
                </div>
            </div>
        `;
    }

    window.select = (idx, type) => {
        const q = questions[currentIdx];
        for(let i=0; i<4; i++) document.getElementById((type==='plus'?'p-':'m-')+i).classList.remove('active');
        document.getElementById((type==='plus'?'p-':'m-')+idx).classList.add('active');
        
        if(!choices[currentIdx]) choices[currentIdx] = {};
        choices[currentIdx][type] = q.options[idx].v;

        const btn = document.getElementById('next-btn');
        if(choices[currentIdx].plus && choices[currentIdx].minus) {
            btn.disabled = (choices[currentIdx].plus === choices[currentIdx].minus);
        }
    };

    window.goNext = () => {
        currentIdx++;
        if(currentIdx < questions.length) renderQuiz();
        else finish();
    };

    async function finish() {
        appDiv.innerHTML = '<div class="card"><div class="loader"></div><p>Сохранение...</p></div>';
        const scores = choices.reduce((acc, curr) => {
            acc[curr.plus]++;
            acc[curr.minus]--;
            return acc;
        }, { D: 0, I: 0, S: 0, C: 0 });

        await updateDoc(doc(db, "tokens", userToken), { results: scores, used: true, finishedAt: new Date().toISOString() });
        appDiv.innerHTML = `<div class="card"><div class="logo">SYSEVOLVE</div><h2>Готово!</h2><p>Спасибо, ${userName}. Анализ завершен.</p></div>`;
    }

    function showError(m) { appDiv.innerHTML = `<div class="card"><h2>⚠</h2><p>${m}</p></div>`; }

    init();
</script>
</body>
</html>
